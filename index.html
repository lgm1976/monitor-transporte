<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Monitor de Transporte</title>
  <meta name="description" content="Mapa en tiempo real de trenes y transporte público a partir de feeds GTFS-RT abiertos." />

  <!-- Tipografía -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Leaflet (mapa) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Tailwind por CDN: válido para prototipo. En producción, ver README (compilación). -->
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="css/estilos.css" />
</head>

<body class="h-full overflow-hidden font-sans text-slate-800" data-panel="abierto" data-cargando="false">
  <div class="flex h-dvh flex-col">

    <!-- Cabecera -->
    <header class="cabecera flex flex-wrap items-center gap-x-4 gap-y-2 px-4 py-3 text-white">
      <div class="flex items-center gap-3">
        <button id="btn-panel" type="button" aria-expanded="true" aria-controls="panel"
          class="rounded-md p-1.5 hover:bg-white/10 md:hidden" title="Mostrar u ocultar el listado">
          <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <h1 class="text-base font-semibold tracking-tight">Monitor de Transporte</h1>
        <span id="etiqueta-modo" class="etiqueta-modo rounded-full px-2.5 py-0.5 text-xs font-semibold">—</span>
      </div>

      <div class="ml-auto flex flex-wrap items-center gap-2 text-sm">
        <span class="flex items-center gap-2 text-white/70" aria-live="polite">
          <span id="indicador-vivo" class="indicador-vivo" data-activo="true"></span>
          <span class="hidden sm:inline">Actualizado</span> <time id="ultima-actualizacion" class="tabular-nums text-white">—</time>
          <span id="texto-intervalo" class="hidden text-white/50 sm:inline"></span>
        </span>
        <button id="btn-refrescar" type="button" class="boton-cabecera">Actualizar</button>
        <button id="btn-pausa" type="button" aria-pressed="false" class="boton-cabecera">Pausar</button>
        <button id="btn-modo" type="button" class="boton-cabecera boton-acento">—</button>
      </div>
    </header>

    <!-- Avisos de error / estado -->
    <div id="aviso" role="alert" hidden class="aviso px-4 py-2 text-sm"></div>

    <main class="relative flex min-h-0 flex-1">
      <!-- Panel lateral -->
      <aside id="panel" class="panel flex w-full shrink-0 flex-col border-r border-slate-200 bg-white md:w-[22rem]">
        <!-- Pestañas del panel -->
        <div class="pestanas" role="tablist" aria-label="Vistas del panel">
          <button type="button" role="tab" id="pestana-trenes" data-vista="trenes" aria-selected="true" aria-controls="vista-trenes">Trenes</button>
          <button type="button" role="tab" id="pestana-trayecto" data-vista="trayecto" aria-selected="false" aria-controls="vista-trayecto">Próximo tren</button>
        </div>

        <!-- Vista «Próximo tren»: de una estación a otra -->
        <section id="vista-trayecto" role="tabpanel" aria-labelledby="pestana-trayecto" hidden class="flex min-h-0 flex-1 flex-col">
          <div class="space-y-2 border-b border-slate-200 p-4">
            <label class="block">
              <span class="mb-1 block text-[11px] font-medium uppercase tracking-wide text-slate-400">Cercanías de</span>
              <select id="trayecto-red" class="selector"></select>
            </label>
            <div class="trayecto-campos">
              <label class="block">
                <span class="mb-1 block text-[11px] font-medium uppercase tracking-wide text-slate-400">Desde</span>
                <input id="trayecto-desde" class="campo" list="lista-estaciones" autocomplete="off" placeholder="Estación de origen" />
              </label>
              <button id="trayecto-intercambiar" type="button" class="boton-intercambiar" title="Intercambiar origen y destino" aria-label="Intercambiar origen y destino">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/></svg>
              </button>
              <label class="block">
                <span class="mb-1 block text-[11px] font-medium uppercase tracking-wide text-slate-400">Hasta</span>
                <input id="trayecto-hasta" class="campo" list="lista-estaciones" autocomplete="off" placeholder="Estación de destino" />
              </label>
            </div>
            <datalist id="lista-estaciones"></datalist>
            <p id="trayecto-lineas" class="trayecto-lineas"></p>
          </div>
          <ul id="trayecto-resultados" class="min-h-0 flex-1 divide-y divide-slate-100 overflow-y-auto" aria-live="polite"></ul>
          <p class="trayecto-nota">Retraso en vivo de los trenes que ya circulan; el resto, según horario.</p>
        </section>

        <!-- Vista «Trenes»: filtros y listado -->
        <section id="vista-trenes" role="tabpanel" aria-labelledby="pestana-trenes" class="flex min-h-0 flex-1 flex-col">
        <div class="space-y-3 border-b border-slate-200 p-4">
          <!-- Ámbito: tipo de servicio y núcleo de Cercanías -->
          <div class="grid grid-cols-2 gap-2">
            <label class="block">
              <span class="mb-1 block text-[11px] font-medium uppercase tracking-wide text-slate-400">Servicio</span>
              <select id="filtro-servicio" class="selector"><option value="">Todos los servicios</option></select>
            </label>
            <label class="block">
              <span class="mb-1 block text-[11px] font-medium uppercase tracking-wide text-slate-400">Núcleo</span>
              <select id="filtro-nucleo" class="selector"><option value="">Todos los núcleos</option></select>
            </label>
          </div>
          <p id="resumen-ambito" class="text-sm text-slate-700" aria-live="polite"></p>
          <div id="contadores" class="grid grid-cols-3 gap-2"></div>
          <p class="text-[11px] text-slate-400">Pulsa un estado para mostrarlo u ocultarlo · <span id="texto-umbrales"></span></p>
          <label class="relative block">
            <span class="sr-only">Buscar por estación, línea o número de tren</span>
            <svg viewBox="0 0 24 24" class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="buscador" type="search" placeholder="Estación, línea o nº de tren"
              class="w-full rounded-lg border border-slate-200 bg-slate-50 py-2 pl-9 pr-3 text-sm placeholder:text-slate-400 focus:border-[color:var(--color-acento)] focus:bg-white focus:outline-none focus:ring-2 focus:ring-[color:var(--color-acento)]/20" />
          </label>
        </div>
        <ul id="lista-vehiculos" class="min-h-0 flex-1 divide-y divide-slate-100 overflow-y-auto"></ul>
        <p id="lista-vacia" hidden class="p-6 text-center text-sm text-slate-400">Ningún vehículo coincide con los filtros.</p>
        </section>
      </aside>

      <!-- Mapa -->
      <section class="relative min-w-0 flex-1">
        <div id="mapa" class="absolute inset-0" role="application" aria-label="Mapa de vehículos en tiempo real"></div>
        <!-- Tarjeta del tren seguido (se rellena desde app.js) -->
        <div id="tarjeta-seguimiento" hidden role="region" aria-label="Tren que estás siguiendo" aria-live="polite"
          class="tarjeta-seguimiento absolute inset-x-3 bottom-8 z-[650] mx-auto max-w-md"></div>
        <!-- Mensaje breve (p. ej. «Enlace copiado») -->
        <div id="toast" hidden role="status" class="toast absolute left-1/2 top-3 z-[700] -translate-x-1/2"></div>
        <button id="btn-encuadrar" type="button" title="Ver todos los vehículos"
          class="absolute left-3 top-3 z-[500] rounded-lg bg-white px-3 py-1.5 text-xs font-semibold text-slate-700 shadow-md ring-1 ring-slate-200 hover:bg-slate-50">
          Ver todos
        </button>
      </section>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
