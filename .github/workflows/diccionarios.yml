# Regenera cada noche los diccionarios de estaciones, líneas y viajes
# a partir del GTFS estático de Renfe (con los trazados de las vías de
# Cercanías), y los horarios de OUIGO (trenes según horario), y los sube
# al repositorio. Los lunes, antes, rehace con OpenStreetMap la red de
# vías de larga distancia (data/trazados/ld/red.json).
# GitHub Pages vuelve a publicar la web automáticamente tras el commit.
name: Actualizar diccionarios GTFS

on:
  schedule:
    # 04:37 en Madrid en invierno (03:37 UTC); Renfe publica sus ficheros de madrugada
    - cron: '37 3 * * *'
  workflow_dispatch: # botón «Run workflow» para lanzarlo a mano
    inputs:
      trazados_osm:
        description: 'Rehacer también la red de vías de larga distancia (OpenStreetMap, ~20 min)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: diccionarios
  cancel-in-progress: true

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Las vías no cambian a diario: solo los lunes o si se pide a mano.
      # Va antes de los diccionarios, que enlazan cada viaje con su trazado.
      # Si Overpass falla, se conserva la red de la semana anterior.
      - name: Red de vías de larga distancia (OpenStreetMap)
        if: github.event_name == 'schedule' || inputs.trazados_osm
        # Límite propio: si Overpass no responde, el paso no puede bloquear la actualización de diccionarios
        timeout-minutes: 20
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%u)" != "1" ]; then
            echo "Hoy no toca (solo los lunes)."; exit 0
          fi
          python3 scripts/generar_trazados_osm.py || echo "::warning::No se pudo rehacer la red de vías de OSM; se mantiene la anterior"

      - name: Generar diccionarios
        run: python3 scripts/generar_diccionarios.py

      # Va después de los diccionarios porque reaprovecha sus nombres de estación.
      # Si falla la descarga de OUIGO, se conserva el horario de la víspera.
      - name: Generar horarios (OUIGO)
        run: python3 scripts/generar_horarios.py || echo "::warning::No se pudo actualizar el horario de OUIGO"

      - name: Subir cambios si los hay
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/diccionarios data/horarios data/trazados
          if git diff --cached --quiet; then
            echo "Sin cambios en los diccionarios."
          else
            git commit -m "Diccionarios GTFS actualizados $(date -u +%Y-%m-%d)"
            git push
          fi
